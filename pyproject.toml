[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
# Ruff's defaults grew with 0.16 (import sorting, RUF rules); keep the earlier
# set, since the code mirrors Home Assistant core's import style.
select = ["E4", "E7", "E9", "F"]
